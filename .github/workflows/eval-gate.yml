# Evaluation regression gate (task 013): ingest the corpus with the real models, run the
# adopted retrieval config on the dev split and fail if it regresses against the committed
# baseline. Dev only: the test split is for deliberate final comparisons.
name: Evaluation gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/retrieval/**"
      - "app/ingestion/**"
      - "app/evaluation/**"
      - "corpus/**"
      - "eval/datasets/**"
      - "eval/configs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-gate.yml"

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"
  # Adopting a new config means committing its dev report and changing these two lines.
  GATE_CONFIG: eval/configs/d2-tokens450.yaml
  GATE_BASELINE: eval/reports/d2-tokens450-dev.json
  GATE_TENANT: eval-corpus-v1
  OUT_DIR: .cache/gate

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evidencedesk
          POSTGRES_PASSWORD: evidencedesk
          POSTGRES_DB: evidencedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evidencedesk -d evidencedesk"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://evidencedesk:evidencedesk@localhost:5432/evidencedesk
      TEST_DATABASE_URL: postgresql+psycopg://evidencedesk:evidencedesk@localhost:5432/evidencedesk_test
      JWT_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Restore the Hugging Face model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          # Bump the suffix when EMBEDDING_MODEL_NAME or RERANKER_MODEL_NAME changes.
          key: hf-bge-small-en-v1.5-ms-marco-MiniLM-L6-v2-1
      - name: Create the test database and migrate
        run: |
          psql "postgresql://evidencedesk:evidencedesk@localhost:5432/evidencedesk" -f docker/postgres-init/01-test-db.sql
          uv run alembic upgrade head
      - name: Real-model tests
        run: uv run pytest -q -m model
      - name: Load the corpus into a fresh tenant
        run: |
          # A throwaway admin password: generated here, never printed, gone with the runner.
          GATE_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export GATE_ADMIN_PASSWORD
          uv run python -m app.auth.cli create-tenant --name "$GATE_TENANT" \
            --admin-email gate@example.com --password-env GATE_ADMIN_PASSWORD
          uv run python -m app.ingestion.cli load-corpus --tenant "$GATE_TENANT" \
            --manifest corpus/manifest.yaml --process
      - name: Run the adopted config on dev
        run: |
          uv run python -m app.evaluation.cli run --config "$GATE_CONFIG" \
            --dataset eval/datasets/evidencedesk-v1.jsonl --split dev \
            --tenant "$GATE_TENANT" --out-dir "$OUT_DIR"
      - name: Gate against the committed baseline
        run: |
          candidate="$OUT_DIR/$(basename "$GATE_BASELINE")"
          uv run python -m app.evaluation.cli gate "$GATE_BASELINE" "$candidate" \
            --out "$OUT_DIR/gate.md"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$OUT_DIR/gate.md" ]; then cat "$OUT_DIR/gate.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: ignore
