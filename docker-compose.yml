# Local development services. Task 001 runs only Postgres; the API and worker
# containers are added in task 013.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evidencedesk
      POSTGRES_PASSWORD: evidencedesk
      POSTGRES_DB: evidencedesk
    # Host port defaults to 5434 to avoid clashing with other local Postgres
    # instances on 5432/5433; override with POSTGRES_HOST_PORT in .env.
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts here run once, on first start with an empty volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencedesk -d evidencedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
