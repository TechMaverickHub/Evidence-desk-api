[project]
name = "evidence-desk-api"
version = "0.1.0"
description = "Evaluation-driven engineering knowledge assistant (FastAPI backend)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

# CPU-only torch wheels: avoids multi-GB CUDA downloads on Linux (Docker, CI).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
# Corpus files are labelled by character offsets: ruff (which also formats code blocks
# inside Markdown) must never rewrite them.
extend-exclude = ["corpus", "tests/fixtures/corpus"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: modern syntax,
# SIM: simplifications, N: PEP 8 naming, BLE: no blind `except Exception` outside approved spots.
select = ["E", "F", "I", "B", "UP", "SIM", "N", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked "model" load the real embedding model (network on first run); opt in with -m model.
addopts = "-ra -m 'not model'"
markers = ["model: loads the real embedding model (slow; downloads it on first run)"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
